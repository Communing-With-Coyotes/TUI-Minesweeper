[project]
name = "tui-minesweeper"
version = "0.1.0"
description = "A terminal-based Minesweeper clone"
readme = "README.md"
dependencies = []

[tool.setuptools]
packages = ["tui-minesweeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]